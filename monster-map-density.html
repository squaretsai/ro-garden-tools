<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO樂園｜怪物地圖密度表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --paper: #fffdf9;
      --ink: #202329;
      --muted: #69707d;
      --line: #ddd5ca;
      --accent: #a5282d;
      --accent-strong: #7f171c;
      --gold: #c8922d;
      --green: #236c5f;
      --blue: #315f9b;
      --shadow: 0 16px 44px rgba(47, 39, 29, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(165, 40, 45, 0.08), transparent 38%),
        linear-gradient(315deg, rgba(35, 108, 95, 0.09), transparent 42%),
        var(--bg);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    main {
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.78);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
      gap: 16px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.9);
      box-shadow: var(--shadow);
    }

    .intro {
      padding: 18px;
    }

    .intro p {
      max-width: 820px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-content: stretch;
      padding: 12px;
    }

    .stat {
      display: grid;
      place-content: center;
      min-height: 86px;
      border: 1px solid rgba(221, 213, 202, 0.8);
      border-radius: 8px;
      background: #fffaf2;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      line-height: 1.1;
    }

    .stat span {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .filters {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) minmax(160px, 0.75fr) minmax(160px, 0.75fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.94);
      box-shadow: 0 10px 28px rgba(47, 39, 29, 0.08);
      backdrop-filter: blur(10px);
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      background: var(--paper);
      color: var(--ink);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .result-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .density-key {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .pill,
    .density {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .density.many { border-color: rgba(35, 108, 95, 0.28); color: var(--green); background: #eef8f3; }
    .density.normal { border-color: rgba(200, 146, 45, 0.34); color: #8a5c08; background: #fff7df; }
    .density.few { border-color: rgba(49, 95, 155, 0.3); color: var(--blue); background: #eef4ff; }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.92);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(221, 213, 202, 0.72);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 66px;
      z-index: 3;
      background: #efe6da;
      color: #43382c;
      font-size: 12px;
      white-space: nowrap;
    }

    td {
      font-size: 14px;
      line-height: 1.45;
    }

    tbody tr:hover {
      background: rgba(200, 146, 45, 0.09);
    }

    .monster-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .monster-sprite {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      object-fit: contain;
      image-rendering: auto;
    }

    .monster-name,
    .map-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
    }

    .sub {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 26px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      header,
      .hero,
      .result-info {
        display: block;
      }

      .back {
        margin-top: 12px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 10px;
      }

      .filters {
        position: static;
        grid-template-columns: 1fr;
      }

      .density-key {
        justify-content: flex-start;
        margin-top: 8px;
      }

      th {
        top: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>怪物地圖密度表</h1>
        <p class="meta">資料從本機 RO Zero 導航檔反編譯整理，密度依導航數量欄推算，並保留原始數量方便後續校正。</p>
      </div>
      <a class="back" href="index.html">回首頁</a>
    </header>

    <section class="hero">
      <div class="panel intro">
        <h2>查哪張圖怪比較多</h2>
        <p>可以輸入怪物名稱、英文代碼、地圖代碼或地圖中文名。像「沙妖」會列出 `yun_f02_a`、`yun_f03_a` 這類地圖，並標示少、普通、很多。</p>
      </div>
      <div class="panel stats" aria-label="資料摘要">
        <div class="stat"><strong id="statRows">0</strong><span>筆資料</span></div>
        <div class="stat"><strong id="statMaps">0</strong><span>張地圖</span></div>
        <div class="stat"><strong id="statMonsters">0</strong><span>種怪物</span></div>
      </div>
    </section>

    <section class="filters" aria-label="篩選">
      <input id="searchInput" type="search" placeholder="搜尋怪物、地圖、英文代碼，例如：沙妖 / SLEEPER / yun_f02_a">
      <select id="densityFilter" aria-label="密度">
        <option value="">全部密度</option>
        <option value="很多">很多</option>
        <option value="普通">普通</option>
        <option value="少">少</option>
      </select>
      <select id="sortSelect" aria-label="排序">
        <option value="monster">怪物名稱</option>
        <option value="map">地圖代碼</option>
        <option value="count">數量多到少</option>
        <option value="level">等級低到高</option>
      </select>
      <button id="resetButton" type="button">清除</button>
    </section>

    <div class="result-info">
      <span id="resultCount">載入中...</span>
      <div class="density-key" aria-label="密度說明">
        <span class="density many">很多 >= 100</span>
        <span class="density normal">普通 30-99</span>
        <span class="density few">少 < 30</span>
      </div>
    </div>

    <section class="table-wrap" aria-label="怪物地圖密度表">
      <table>
        <thead>
          <tr>
            <th style="width: 28%;">怪物</th>
            <th style="width: 29%;">地圖</th>
            <th style="width: 12%;">密度</th>
            <th style="width: 10%;">數量</th>
            <th style="width: 9%;">等級</th>
            <th style="width: 12%;">導航 ID</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>找不到符合條件的資料。</div>
    </section>
  </main>

  <script src="assets/monster-density/monster-density-data.js"></script>
  <script>
    const data = Array.isArray(window.RO_MONSTER_DENSITY) ? window.RO_MONSTER_DENSITY : [];
    const state = {
      query: "",
      density: "",
      sort: "monster"
    };

    const $ = (id) => document.getElementById(id);
    const body = $("resultBody");
    const emptyState = $("emptyState");
    const resultCount = $("resultCount");
    const searchInput = $("searchInput");
    const densityFilter = $("densityFilter");
    const sortSelect = $("sortSelect");

    function densityClass(label) {
      if (label === "很多") return "many";
      if (label === "普通") return "normal";
      return "few";
    }

    function imgFor(row) {
      const match = String(row.code || "").match(/(\d+)$/);
      return match ? `https://static.divine-pride.net/images/mobs/png/${match[1]}.png` : "";
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function compareRows(a, b) {
      if (state.sort === "count") return b.count - a.count || a.monster.localeCompare(b.monster, "zh-Hant");
      if (state.sort === "level") return a.level - b.level || a.monster.localeCompare(b.monster, "zh-Hant");
      if (state.sort === "map") return a.map.localeCompare(b.map) || a.monster.localeCompare(b.monster, "zh-Hant");
      return a.monster.localeCompare(b.monster, "zh-Hant") || a.map.localeCompare(b.map);
    }

    function filterRows() {
      const terms = normalize(state.query).split(/\s+/).filter(Boolean);
      return data.filter((row) => {
        if (state.density && row.density !== state.density) return false;
        if (!terms.length) return true;
        const haystack = normalize([row.monster, row.code, row.map, row.mapName, row.level, row.count].join(" "));
        return terms.every((term) => haystack.includes(term));
      }).sort(compareRows);
    }

    function render() {
      const rows = filterRows();
      const visible = rows.slice(0, 450);
      body.innerHTML = visible.map((row) => {
        const image = imgFor(row);
        const imageHtml = image
          ? `<img class="monster-sprite" src="${image}" alt="" loading="lazy" onerror="this.remove()">`
          : "";
        return `
          <tr>
            <td>
              <div class="monster-cell">
                ${imageHtml}
                <span>
                  <span class="monster-name">${row.monster}</span>
                  <span class="sub">${row.code}</span>
                </span>
              </div>
            </td>
            <td>
              <span class="map-name">${row.mapName || row.map}</span>
              <span class="sub">${row.map}</span>
            </td>
            <td><span class="density ${densityClass(row.density)}">${row.density}</span></td>
            <td><span class="pill">${row.count}</span></td>
            <td>Lv.${row.level}</td>
            <td>${row.navId}</td>
          </tr>
        `;
      }).join("");
      emptyState.hidden = rows.length > 0;
      resultCount.textContent = rows.length > 450
        ? `符合 ${rows.length.toLocaleString("zh-Hant")} 筆，先顯示前 450 筆`
        : `符合 ${rows.length.toLocaleString("zh-Hant")} 筆`;
    }

    function init() {
      $("statRows").textContent = data.length.toLocaleString("zh-Hant");
      $("statMaps").textContent = new Set(data.map((row) => row.map)).size.toLocaleString("zh-Hant");
      $("statMonsters").textContent = new Set(data.map((row) => row.monster)).size.toLocaleString("zh-Hant");

      searchInput.addEventListener("input", () => {
        state.query = searchInput.value;
        render();
      });
      densityFilter.addEventListener("change", () => {
        state.density = densityFilter.value;
        render();
      });
      sortSelect.addEventListener("change", () => {
        state.sort = sortSelect.value;
        render();
      });
      $("resetButton").addEventListener("click", () => {
        state.query = "";
        state.density = "";
        state.sort = "monster";
        searchInput.value = "";
        densityFilter.value = "";
        sortSelect.value = "monster";
        render();
      });

      const params = new URLSearchParams(location.search);
      const q = params.get("q");
      if (q) {
        searchInput.value = q;
        state.query = q;
      }
      render();
    }

    init();
  </script>
</body>
</html>
