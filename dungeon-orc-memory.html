<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="assets/dungeon-guides/dungeon-guide.css">
  <title>RO樂園 獸人的記憶副本攻略</title>

<body data-dungeon="orc">
  <div class="sitebar"><div class="site-name">RO樂園副本攻略</div><nav class="site-actions" aria-label="頁面連結"><a class="home-link" href="quest_drop_rates.html">副本攻略</a><a class="home-link" href="index.html">首頁</a></nav></div>
  <section class="hero" aria-labelledby="page-title"><div class="hero-inner"><p class="eyebrow" id="page-subtitle"></p><h1 id="page-title"></h1><p class="hero-copy" id="page-description"></p></div></section>
  <section class="facts-band" aria-label="快速資訊"><div class="facts" id="facts"></div></section>
  <nav class="quick-nav" aria-label="攻略段落"><div class="quick-nav-inner"><a href="#route">流程</a><a href="#monsters">怪物</a><a href="#rewards">獎勵</a><a href="#equipment">裝備</a><a href="#gallery">圖文</a></div></nav>
  <main class="main">
    <section class="section" id="route"><div class="section-heading"><div><p class="eyebrow">ROUTE</p><h2>流程攻略</h2></div><p>先用官方確認資訊整理第一版，缺少實測的細節會明確保留提醒。</p></div><div class="grid route-grid" id="routeGrid"></div></section>
    <section class="section" id="monsters"><div class="section-heading"><div><p class="eyebrow">MONSTERS</p><h2>代表怪物</h2></div><p>點怪物卡可開 TWROZ 魔物資料頁。</p></div><div class="monster-grid" id="monsterGrid"></div></section>
    <section class="section" id="rewards"><div class="section-heading"><div><p class="eyebrow">REWARDS</p><h2>獎勵與材料</h2></div><p>不寫死未確認掉落率，只整理官方明確列出的用途。</p></div><div class="grid reward-grid" id="rewardGrid"></div></section>
    <section class="section" id="equipment"><div class="section-heading"><div><p class="eyebrow">EQUIPMENT</p><h2>裝備、附魔與 NPC</h2></div><p>座標可直接複製到遊戲內。</p></div><div class="grid npc-grid" id="npcGrid"></div><div class="grid reward-grid" id="equipmentGrid" style="margin-top:12px"></div></section>
    <section class="section"><div class="section-heading"><div><p class="eyebrow">NOTES</p><h2>注意事項</h2></div></div><div class="grid" id="notes"></div></section>
    <section class="section" id="gallery"><div class="section-heading"><div><p class="eyebrow">OFFICIAL IMAGES</p><h2>官方圖文</h2></div></div><div class="gallery" id="galleryGrid"></div></section>
    <section class="section"><div class="section-heading"><div><p class="eyebrow">SOURCES</p><h2>來源</h2></div></div><div class="source-list" id="sources"></div></section>
  </main>
  <script src="assets/dungeon-guides/dungeon-guide-data.js"></script><script src="assets/dungeon-guides/dungeon-guide-renderer.js"></script>
