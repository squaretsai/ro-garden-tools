<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO樂園 地區前置任務速查</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f1;
      --paper: #fffdf8;
      --ink: #20242a;
      --muted: #68717a;
      --line: #d9ded0;
      --line-strong: #b7c1ad;
      --green: #1f6b55;
      --green-dark: #154c3d;
      --red: #a33238;
      --gold: #bc812a;
      --blue: #2f5d88;
      --field: #ffffff;
      --shadow: 0 18px 44px rgba(31, 45, 35, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(31, 107, 85, 0.12), transparent 34%),
        linear-gradient(320deg, rgba(188, 129, 42, 0.11), transparent 36%),
        var(--bg);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid rgba(31, 107, 85, 0.25);
      border-radius: var(--radius);
      background: #f9fff4;
      color: var(--green-dark);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.8);
      color: #3f4a45;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.93);
      box-shadow: var(--shadow);
    }

    .search-panel {
      padding: 12px;
    }

    .search-label {
      display: block;
      margin-bottom: 7px;
      color: #44514a;
      font-size: 13px;
      font-weight: 900;
    }

    .search-box {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: var(--field);
      color: var(--ink);
      outline: none;
    }

    .search-box:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(31, 107, 85, 0.12);
    }

    .tabs {
      display: grid;
      gap: 6px;
      padding: 8px;
    }

    .tab {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 48px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: #39423e;
      text-align: left;
      cursor: pointer;
    }

    .tab:hover,
    .tab:focus-visible {
      border-color: var(--line);
      background: #f7faf2;
      outline: none;
    }

    .tab[aria-selected="true"] {
      border-color: rgba(31, 107, 85, 0.32);
      background: #eef7ec;
      color: var(--green-dark);
      box-shadow: inset 3px 0 0 var(--green);
    }

    .tab-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(31, 107, 85, 0.18);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .tab-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 900;
    }

    .tab-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .level-chip {
      display: inline-flex;
      min-width: 52px;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 999px;
      background: #fff5df;
      color: #7d520d;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .content {
      min-width: 0;
    }

    .guide {
      overflow: hidden;
    }

    .guide-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(31, 107, 85, 0.08), rgba(47, 93, 136, 0.06));
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .guide-title {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .guide-desc {
      max-width: 740px;
      margin: 10px 0 0;
      color: #53605a;
      font-size: 15px;
      line-height: 1.75;
    }

    .status-board {
      display: grid;
      align-content: start;
      gap: 8px;
      padding: 13px;
      border: 1px solid rgba(31, 107, 85, 0.2);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      min-height: 30px;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(105, 119, 109, 0.25);
      font-size: 13px;
    }

    .stat:last-child {
      border-bottom: 0;
    }

    .stat b {
      color: #46514c;
      white-space: nowrap;
    }

    .stat span {
      color: var(--muted);
      text-align: right;
      font-weight: 800;
    }

    .guide-body {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .section {
      display: grid;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-title::before {
      content: "";
      width: 8px;
      height: 22px;
      border-radius: 99px;
      background: var(--green);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .info-tile {
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .info-tile b {
      display: block;
      margin-bottom: 6px;
      color: var(--green-dark);
      font-size: 13px;
    }

    .info-tile span {
      color: #4f5b55;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 800;
    }

    .route {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .route-step {
      position: relative;
      min-height: 132px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .route-num {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      margin-bottom: 9px;
      border-radius: var(--radius);
      background: var(--green);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
    }

    .route-step h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .route-step p {
      margin: 8px 0 0;
      color: #5b675f;
      font-size: 13px;
      line-height: 1.62;
    }

    .npc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .npc {
      min-height: 124px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .npc b {
      display: block;
      margin-bottom: 6px;
      color: #26322d;
      font-size: 14px;
      line-height: 1.35;
    }

    .npc code,
    .coord {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 7px;
      border: 1px solid #dce6d6;
      border-radius: 6px;
      background: #f8fbf5;
      color: #294f40;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .npc p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.58;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }

    .note {
      padding: 12px;
      border: 1px solid rgba(47, 93, 136, 0.22);
      border-radius: var(--radius);
      background: #f5f9fc;
      color: #405263;
      font-size: 13px;
      line-height: 1.62;
    }

    .note.important {
      border-color: rgba(163, 50, 56, 0.23);
      background: #fff5f5;
      color: #6c3437;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    figure img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #edf1ea;
    }

    figcaption {
      min-height: 44px;
      padding: 9px 10px;
      color: #5a655f;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
    }

    .source-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-list a {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: #435048;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
    }

    .source-list a:hover,
    .source-list a:focus-visible {
      border-color: var(--green);
      outline: none;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }

    .overview-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
      min-height: 188px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .overview-card:hover,
    .overview-card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(31, 107, 85, 0.42);
      box-shadow: 0 18px 42px rgba(31, 45, 35, 0.16);
      outline: none;
    }

    .overview-card.has-image {
      min-height: 230px;
      border-color: rgba(20, 39, 31, 0.2);
      background:
        linear-gradient(180deg, rgba(13, 22, 19, 0.08), rgba(13, 22, 19, 0.24) 42%, rgba(13, 22, 19, 0.78)),
        var(--card-image) center / cover no-repeat;
      color: #ffffff;
    }

    .overview-card.has-image::after {
      content: "官方圖";
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 999px;
      background: rgba(19, 29, 25, 0.52);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .overview-card h3 {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .overview-card p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .overview-card.has-image p {
      color: rgba(255, 255, 255, 0.86);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.32);
    }

    .badge-row {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 11px;
    }

    .badge {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 3px 7px;
      border-radius: 999px;
      background: #edf5ea;
      color: #245343;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .overview-card.has-image .badge {
      background: rgba(255, 255, 255, 0.88);
      color: #173e34;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 920px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .tabs {
        display: flex;
        overflow-x: auto;
        padding-bottom: 10px;
        scroll-snap-type: x proximity;
      }

      .tab {
        min-width: 220px;
        scroll-snap-align: start;
      }

      .guide-head {
        grid-template-columns: 1fr;
      }

      .quick-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 18px, 1180px);
        padding-top: 14px;
      }

      .brand {
        align-items: flex-start;
      }

      .mark {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .guide-head,
      .guide-body {
        padding: 14px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .tab {
        min-width: 196px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">RO</div>
        <div>
          <h1>地區前置任務速查</h1>
          <p class="subtitle">RO樂園用，整理「怎麼去、先找誰、解完開什麼、常用NPC在哪」。最後更新：2026/07/31。</p>
        </div>
      </div>
      <nav class="top-actions" aria-label="外部連結">
        <a class="link-button" href="https://roz.gnjoy.com.tw/Notice/List" target="_blank" rel="noreferrer">官方公告</a>
        <a class="link-button" href="https://rz.fharr.com/" target="_blank" rel="noreferrer">幻想廳</a>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="地區頁籤">
        <section class="panel search-panel">
          <label class="search-label" for="guide-search">搜尋地區、NPC、座標</label>
          <input id="guide-search" class="search-box" type="search" placeholder="例：貓嘴、火靈礦石、alberta">
        </section>
        <nav id="tabs" class="panel tabs" role="tablist" aria-label="地區列表"></nav>
      </aside>

      <section class="content">
        <article id="guide" class="panel guide" aria-live="polite"></article>
      </section>
    </div>
  </main>

  <script>
    const guides = [
      {
        id: "overview",
        icon: "ALL",
        name: "總覽",
        area: "先看這頁",
        level: "速查",
        headline: "先判斷你要解的是「進地圖」還是「解鎖NPC」",
        desc: "樂園近期地區多半是 BaseLv90 以上，艾爾貝塔搭船進場；真正麻煩的是到當地後，要把主線或居民初次請求跑完，才會開武器、書卷、頭飾、每日或奇物交換。",
        status: {
          "最常用起點": "艾爾貝塔",
          "90等地區": "洛陽 / 崑崙 / 哎喲泰雅 / 天津",
          "100等地區": "朱諾每日委託",
          "材料型任務": "汶巴拉屬性礦石"
        },
        type: "overview",
        notes: [
          "頁面內的官方地圖資訊以 RO樂園公告為主；沒有完整公告步驟的舊任務，會明確標成玩家攻略整理。",
          "如果你只想打每日，優先確認是否已經跑完當地的第一次對話或主線開通。",
          "多數奇物交換是 2,000,000 Zeny 每日一次，04:00 重置；有些也可用傑斯塔 20 交換。"
        ],
        cards: [
          { id: "louyang", title: "洛陽", text: "艾爾貝塔 245,40 搭船。王陵士兵與召天線是頭飾與後續功能重點。", image: "https://news.gnjoy.com.tw/Uploads2/2026/04/20/ea8d67533f4c4defa76d838eb4ea2415.gif", tags: ["Base90", "地龍石", "每日/頭飾"] },
          { id: "gonryun", title: "崑崙", text: "艾爾貝塔 246,62 搭船。先找張青龍，再拜訪堂主史艷文。", image: "https://news.gnjoy.com.tw/Uploads2/2026/03/04/dbf90b603abd4406b8c51c646eb3aa7c.png", tags: ["Base90", "靈幻石", "居民初次請求"] },
          { id: "ayothaya", title: "哎喲泰雅", text: "航海士安東尼奧前要先處理福蘭奇斯闊與贊助者。當地潑水節線解完開死靈系統。", image: "https://news.gnjoy.com.tw/Uploads2/2026/04/20/702c52ff188e4087a923b29653b146ee.gif", tags: ["Base90", "死靈石", "貓眼/貓嘴材料"] },
          { id: "amatsu", title: "天津", text: "艾爾貝塔 246,34 搭船。守門士兵接到城主協助線，解完開陰陽武器與戰盔。", image: "https://news.gnjoy.com.tw/Uploads2/2026/05/18/42a461648d644c5390cb7b518e55a677.gif", tags: ["Base90", "魔靈石", "忍者地圖"] },
          { id: "yuno", title: "朱諾", text: "依斯魯得飛空艇或艾爾帕蘭北上。每日委託多為 Base100。", image: "https://news.gnjoy.com.tw/Uploads2/2026/06/23/337bdcc0161248dc94ffbdd210323ea5.jpg", tags: ["Base100", "飛空艇", "每日委託"] },
          { id: "umbala", title: "汶巴拉", text: "先做語言任務與薩滿家族線，再用怪物材料換屬性礦石。", tags: ["屬性礦石", "火靈礦石", "蠍子尾巴"] },
          { id: "niflheim", title: "死都 尼芙菲姆", text: "地域特殊，官方公告明寫不能用傑斯塔、世界移動券前往，也不能 /memo。", image: "https://news.gnjoy.com.tw/Uploads2/2025/08/12/7bdf19bde7bd4123838d1d3cf0956050.jpg", tags: ["死都", "不能memo", "汶巴拉路線"] },
          { id: "turtle", title: "龜島", text: "以玩家攻略整理為主：艾爾貝塔旅館找烏龜老伯，解前進龜島路線。", tags: ["玩家攻略", "進場任務"] }

    const tabs = document.querySelector("#tabs");
    const guide = document.querySelector("#guide");
    const search = document.querySelector("#guide-search");

    function coordLink(raw) {
      if (!raw || raw === "umbala" || raw === "ayothaya") return "";
      const parts = raw.trim().split(/\s+/);
      if (parts.length < 3) return "";
      return `/navi ${parts[0]}/${parts[1]}/${parts[2]}`;
    }

    function renderTabs(activeId = "overview", filter = "") {
      const q = filter.trim().toLowerCase();
      tabs.innerHTML = "";
      const visible = guides.filter((item) => {
        if (!q) return true;
        return JSON.stringify(item).toLowerCase().includes(q);
      });
      if (!visible.length) {
        tabs.innerHTML = '<div class="empty">找不到相關地區，試試 NPC 名稱、座標或材料名。</div>';
        return;
      }
      for (const item of visible) {
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.role = "tab";
        button.id = `tab-${item.id}`;
        button.setAttribute("aria-controls", `panel-${item.id}`);
        button.setAttribute("aria-selected", item.id === activeId ? "true" : "false");
        button.dataset.id = item.id;
        button.innerHTML = `
          <span class="tab-icon" aria-hidden="true">${item.icon}</span>
          <span>
            <span class="tab-title">${item.name}</span>
            <span class="tab-meta">${item.area}</span>
          </span>
          <span class="level-chip">${item.level}</span>
        `;
        tabs.appendChild(button);
      }
    }

    function renderGuide(id = "overview") {
      const item = guides.find((entry) => entry.id === id) || guides[0];
      document.title = `${item.name}｜RO樂園 地區前置任務速查`;
      const status = Object.entries(item.status || {}).map(([key, value]) => `
        <div class="stat"><b>${key}</b><span>${value}</span></div>
      `).join("");
      const quick = (item.quick || []).map(([key, value]) => `
        <div class="info-tile"><b>${key}</b><span>${value}</span></div>
      `).join("");
      const steps = (item.steps || []).map(([title, text], index) => `
        <div class="route-step">
          <div class="route-num">${index + 1}</div>
          <h3>${title}</h3>
          <p>${text}</p>
        </div>
      `).join("");
      const npcs = (item.npcs || []).map(([name, coord, text]) => {
        const navi = coordLink(coord);
        return `
          <div class="npc">
            <b>${name}</b>
            <code>${coord}</code>
            ${navi ? `<p><span class="coord">${navi}</span></p>` : ""}
            <p>${text}</p>
          </div>
        `;
      }).join("");
      const notes = (item.notes || []).map((note, index) => `
        <div class="note ${index === 0 ? "important" : ""}">${note}</div>
      `).join("");
      const gallery = (item.images || []).map(([src, caption]) => {
        const isPage = src.startsWith("http") && !/\.(png|jpg|jpeg|gif|apng|webp)(\?|$)/i.test(src);
        if (isPage) {
          return `<div class="note"><a href="${src}" target="_blank" rel="noreferrer">${caption}</a></div>`;
        }
        return `
          <figure>
            <img src="${src}" alt="${caption}" loading="lazy">
            <figcaption>${caption}</figcaption>
          </figure>
        `;
      }).join("");
      const sources = (item.sources || []).map((source) => `
        <a href="${source.url}" target="_blank" rel="noreferrer">${source.label}</a>
      `).join("");

      if (item.type === "overview") {
        const cards = item.cards.map((card) => `
          <button class="overview-card ${card.image ? "has-image" : ""}" type="button" data-jump="${card.id}" ${card.image ? `style="--card-image: url('${card.image}')"` : ""}>
            <h3>${card.title}</h3>
            <p>${card.text}</p>
            <div class="badge-row">${card.tags.map((tag) => `<span class="badge">${tag}</span>`).join("")}</div>
          </button>
        `).join("");
        guide.innerHTML = `
          <header class="guide-head" id="panel-${item.id}" role="tabpanel" aria-labelledby="tab-${item.id}">
            <div>
              <p class="eyebrow">${item.area}</p>
              <h2 class="guide-title">${item.headline}</h2>
              <p class="guide-desc">${item.desc}</p>
            </div>
            <div class="status-board">${status}</div>
          </header>
          <div class="guide-body">
            <section class="section">
              <h2 class="section-title">地區卡片</h2>
              <div class="overview-grid">${cards}</div>
            </section>
            <section class="section">
              <h2 class="section-title">整理原則</h2>
              <div class="note-grid">${notes}</div>
            </section>
            <section class="section">
              <h2 class="section-title">來源</h2>
              <div class="source-list">${sources}</div>
            </section>
          </div>
        `;
        return;
      }

      guide.innerHTML = `
        <header class="guide-head" id="panel-${item.id}" role="tabpanel" aria-labelledby="tab-${item.id}">
          <div>
            <p class="eyebrow">${item.area}</p>
            <h2 class="guide-title">${item.headline}</h2>
            <p class="guide-desc">${item.desc}</p>
          </div>
          <div class="status-board">${status}</div>
        </header>
        <div class="guide-body">
          <section class="section">
            <h2 class="section-title">快速判斷</h2>
            <div class="quick-grid">${quick}</div>
          </section>
          <section class="section">
            <h2 class="section-title">跑法</h2>
            <div class="route">${steps}</div>
          </section>
          <section class="section">
            <h2 class="section-title">NPC 與座標</h2>
            <div class="npc-grid">${npcs}</div>
          </section>
          <section class="section">
            <h2 class="section-title">注意事項</h2>
            <div class="note-grid">${notes}</div>
          </section>
          ${gallery ? `
            <section class="section">
              <h2 class="section-title">圖文參考</h2>
              <div class="gallery">${gallery}</div>
            </section>
          ` : ""}
          <section class="section">
            <h2 class="section-title">來源</h2>
            <div class="source-list">${sources}</div>
          </section>
        </div>
      `;
    }

    function setActive(id, updateHash = true) {
      const active = guides.some((item) => item.id === id) ? id : "overview";
      renderTabs(active, search.value);
      renderGuide(active);
      if (updateHash) {
        history.replaceState(null, "", `#${active}`);
      }
    }

    tabs.addEventListener("click", (event) => {
      const button = event.target.closest(".tab");
      if (!button) return;
      setActive(button.dataset.id);
    });

    guide.addEventListener("click", (event) => {
      const card = event.target.closest(".overview-card[data-jump]");
      if (!card) return;
      setActive(card.dataset.jump);
    });

    search.addEventListener("input", () => {
      const active = location.hash.replace("#", "") || "overview";
      renderTabs(active, search.value);
    });

    window.addEventListener("hashchange", () => setActive(location.hash.replace("#", "") || "overview", false));

    setActive(location.hash.replace("#", "") || "overview", false);
  </script>
